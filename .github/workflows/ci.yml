name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      - run: npm run build
      - run: npm run size
      - run: npm run check:package
      - run: npm audit
      - run: npx playwright install --with-deps
      - run: npm run test:examples

  browsers:
    name: browsers (${{ matrix.node }}, ${{ matrix.target.project }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        target:
          - { project: chromium, runner: ubuntu-latest }
          - { project: firefox, runner: ubuntu-latest }
          # Preserve the original Apple Silicon platform with an explicit OS image.
          - { project: webkit, runner: macos-26 }
          - { project: iphone, runner: macos-latest }
          - { project: pixel, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      # Historical absolute toggle timings are reported on shared runners.
      # Section 8 gates absolute init on the maintainer Mac; CI gates its trend.
      - id: timing
        continue-on-error: true
        if: matrix.target.project != 'iphone' && matrix.target.project != 'pixel'
        run: npx playwright test --project=${{ matrix.target.project }} --grep '5000-(node|element) toggle budget' --workers=1
      - if: ${{ !cancelled() && (success() || steps.timing.outcome == 'failure') }}
        run: npx playwright test --project=${{ matrix.target.project }} --grep-invert '5000-(node|element) toggle budget' --workers=1

  performance:
    name: init trend (${{ matrix.node }})
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      # Absolute times are reported; a median regression above 50% fails this job.
      - run: npm run perf -- --ci --baseline reports/perf-ci-node${{ matrix.node }}-baseline.json --output reports/perf-ci-node${{ matrix.node }}.json

  site:
    name: site (22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:site
      - run: npm run test:site-snippets
