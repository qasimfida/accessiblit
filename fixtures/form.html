<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Readable form controls</title>
    <link rel="stylesheet" href="/content.css" />
    <style></style>
    <script type="module" src="/content.mjs"></script>
  </head>
  <body>
    <nav aria-label="Fixture navigation">
      <a href="/article.html">Article</a><a href="/form.html">Form</a>
    </nav>
    <main>
      <h1>A form with room to grow</h1>
      <p id="form-copy" data-content-probe>
        Labels and controls keep their relationships when text and spacing
        change.
      </p>
      <form>
        <fieldset>
          <legend>Contact details</legend>
          <label for="name"
            >Name<input id="name" value="Ada" autocomplete="name" /></label
          ><label for="email"
            >Email<input
              id="email"
              type="email"
              value="ada@example.test"
              autocomplete="email" /></label
          ><label for="topic"
            >Topic<select id="topic">
              <option>Reading</option>
              <option>Navigation</option>
            </select></label
          ><label for="note"
            >Note<textarea id="note" rows="3">A short message.</textarea></label
          ><label class="choice"
            ><input type="checkbox" checked />Send updates</label
          ><button type="button">Save</button>
        </fieldset>
      </form>
    </main>
  </body>
</html>
