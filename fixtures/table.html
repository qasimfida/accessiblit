<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231456a0%22%2F%3E%3Cpath%20fill%3D%22white%22%20fill-rule%3D%22evenodd%22%20d%3D%22M6%2026%2013%206h6l7%2020h-5l-1-4h-8l-1%204zm8-8h4l-2-7z%22%2F%3E%3C%2Fsvg%3E"
    />
    <title>Readable data table</title>
    <link rel="stylesheet" href="/content.css" />
    <style>
      .amount {
        text-align: end;
      }
    </style>
    <script type="module" src="/content.mjs"></script>
  </head>
  <body>
    <nav aria-label="Fixture navigation">
      <a href="/article.html">Article</a><a href="/form.html">Form</a>
    </nav>
    <main>
      <h1>A small order table</h1>
      <p>The table keeps each value inside its own cell.</p>
      <div
        class="table-scroll"
        role="region"
        aria-label="Order table"
        tabindex="0"
      >
        <table>
          <caption>
            Current order
          </caption>
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Qty</th>
              <th scope="col">Cost</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="table-copy" data-content-probe>Oak mug</td>
              <td>2</td>
              <td class="amount">$12</td>
            </tr>
            <tr>
              <td>Steel cup</td>
              <td>1</td>
              <td class="amount">$9</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
